<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de Códigos</title>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <link rel="shortcut icon" href="NexConfus.png" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/lua/lua.min.js"></script>

    <!-- CSS propio -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="sidebar">
        <header>
            <span>∞ Carpetas</span>
            <button id="newFolderBtn">+𝘯𝘦𝘸</button>
        </header>
        <div id="folderList"></div>
    </div>

    <div id="editor-container">
        <header>
            <span class="nexito"><img src="NexConfus.png" alt="💚">Nexopolis</span>
            <span id="currentPathLabel" class="current-path"></span>
            <input id="searchInput" placeholder="🔍 Buscar snippet o carpeta...">
        </header>

        <div id="toolbar">
            <div class="toolbar-group">
                <button id="newBtn" class="btn-primary">Ψ Nuevo</button>
                <button id="saveBtn">Ξ Guardar</button>
                <button id="renameBtn">Θ Renombrar</button>
                <button id="deleteBtn">Φ Borrar</button>
                <button id="exportBtn">⭳ Exportar</button>
                <button id="importBtn">⭱ Importar</button>
                <button id="copyAllBtn">⧉ Copiar Todo</button>
                <button id="selectModeBtn">☑ Seleccionar</button>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
            <span class="shortcut-hint">
                Alt+N = Nuevo | Ctrl+S = Guardar | Ctrl+R = Renombrar | Ctrl+B = Borrar | Ctrl+A = Copiar
            </span>
        </div>

        <div id="bulkActionsBar" class="hidden">
            <span id="selectionCount">0 seleccionados</span>
            <div class="bulk-buttons">
                <button id="bulkMoveBtn">Mover a...</button>
                <button id="bulkExportBtn">Exportar selección</button>
                <button id="bulkDeleteBtn">Eliminar selección</button>
                <button id="bulkCancelBtn">Cancelar</button>
            </div>
        </div>

        <div id="editor"></div>
    </div>

    <div id="modal-overlay" class="hidden">
        <div id="modal-box">
            <h2 id="modal-title">Título</h2>
            <p id="modal-message">Mensaje</p>

            <input id="modal-input" type="text" />
            <select id="modal-folder-select" class="hidden"></select>

            <div id="modal-buttons">
                <button id="modal-cancel">Cancelar</button>
                <button id="modal-ok">Aceptar</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>


    <!-- JS propio -->
    <script src="script.js"></script>
</body>

</html>
